name: Deploy WordPress.org Readme

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-wordpress-readme
  cancel-in-progress: false

jobs:
  deploy-readme:
    runs-on: ubuntu-latest
    env:
      SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
      SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update WordPress.org readmes
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$SVN_USERNAME" || -z "$SVN_PASSWORD" ]]; then
            echo "SVN_USERNAME and SVN_PASSWORD repository secrets are required."
            exit 1
          fi

          stable=$(sed -n 's/^Stable tag: //p' readme.txt)
          if [[ ! "$stable" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "Invalid Stable tag: $stable"
            exit 1
          fi

          svn_dir="$RUNNER_TEMP/egentify-wordpress-svn"
          svn checkout --depth empty \
            "https://plugins.svn.wordpress.org/egentify-for-woocommerce/" \
            "$svn_dir"
          cd "$svn_dir"
          svn update --parents "trunk/readme.txt" "tags/$stable/readme.txt"

          changed=0
          for target in "trunk/readme.txt" "tags/$stable/readme.txt"; do
            if ! cmp -s "$GITHUB_WORKSPACE/readme.txt" "$target"; then
              cp "$GITHUB_WORKSPACE/readme.txt" "$target"
              changed=1
            fi
          done

          if (( changed == 0 )); then
            echo "WordPress.org readmes are already current."
            exit 0
          fi

          svn diff "trunk/readme.txt" "tags/$stable/readme.txt"
          svn commit "trunk/readme.txt" "tags/$stable/readme.txt" \
            --message "Add Egentify overview video to plugin readme" \
            --username "$SVN_USERNAME" \
            --password "$SVN_PASSWORD" \
            --non-interactive \
            --no-auth-cache
