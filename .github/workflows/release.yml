name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tag matches plugin version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          HEADER=$(sed -n 's/^ \* Version: //p' egentify-for-woocommerce.php)
          STABLE=$(sed -n 's/^Stable tag: //p' readme.txt)
          [ "$HEADER" = "$VERSION" ] || { echo "Plugin Version header is '$HEADER', tag is '$VERSION'"; exit 1; }
          [ "$STABLE" = "$VERSION" ] || { echo "readme.txt Stable tag is '$STABLE', tag is '$VERSION'"; exit 1; }

      # Versionless zip powers the stable latest-download URL; the versioned
      # copy is self-documenting on the Releases page.
      - name: Build plugin zip
        run: bash bin/build-zip.sh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/egentify-for-woocommerce.zip
            build/egentify-for-woocommerce-*.zip
          generate_release_notes: true
          draft: false
          prerelease: false

  deploy-to-wordpress-org:
    needs: build-and-release
    runs-on: ubuntu-latest
    env:
      SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
      SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pushes trunk + SVN tag to WordPress.org; skips if secrets are unset.
      - name: Deploy to WordPress.org SVN
        if: ${{ env.SVN_USERNAME != '' && env.SVN_PASSWORD != '' }}
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
